<html lang="en">
    <head>
        <title>Calorie Tracker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <form method="POST">
                        <div class="form-group row">
                            {% csrf_token %}
                            <label class="col-form-label">
                                <b>Select Food to Add</b>
                            </label>
                            <select class="form-control md-5" name="food_consumed" id="food_consumed">
                                {% for food in foods %}
                                    <option value="{{ food.name }}">
                                        {{ food.name }}
                                    </option>
                                {% endfor %}
                            </select>
                            <button class="btn btn-success rounded-pill mt-2" type="submit">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>


        {% for c in consumed_food %}
            {{ c.food_consumed.name }} --> {{ c.food_consumed.carbs }} --> {{ c.food_consumed.protein }} --> {{ c.food_consumed.fats }} --> {{ c.food_consumed.calories }}
            <br>
        {% endfor %}
    </body>
</html>
