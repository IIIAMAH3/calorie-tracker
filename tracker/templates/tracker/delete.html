<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Food</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 0.5rem;
            color: #d32f2f;
        }

        .card p {
            color: #555;
            margin-bottom: 2rem;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #d32f2f;
            color: #fff;
        }

        .btn-delete:hover {
            background-color: #b71c1c;
        }

        .btn-cancel {
            background-color: #e0e0e0;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancel:hover {
            background-color: #cfcfcf;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Delete food item?</h2>
    <p>
        This will remove the food from your consumed list.
        This action cannot be undone.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="actions">
            <a href="{% url 'index' %}" class="btn btn-cancel">Cancel</a>
            <button type="submit" class="btn btn-delete">Delete</button>
        </div>
    </form>
</div>

</body>
</html>
